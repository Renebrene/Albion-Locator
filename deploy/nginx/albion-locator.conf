# Example LAN reverse proxy for the Albion Locator.
# The application itself must keep listening on 127.0.0.1:8021.
# Replace albion.local and the certificate paths with your internal names.

upstream albion_locator {
    server 127.0.0.1:8021;
    keepalive 16;
}

server {
    listen 80;
    server_name albion.local;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name albion.local;

    ssl_certificate     /etc/ssl/albion/albion.local.crt;
    ssl_certificate_key /etc/ssl/albion/albion.local.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 110m;
    proxy_read_timeout 120s;

    # Do not expose Prometheus metrics through the public/office listener.
    location = /metrics {
        return 404;
    }

    location / {
        proxy_pass http://albion_locator;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
